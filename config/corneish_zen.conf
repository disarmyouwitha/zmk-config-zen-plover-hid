# Sleep after 15 minutes, as in the original configuration.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Dedicated Plover HID reports, separate from ordinary keyboard reports.
CONFIG_ZMK_HID_IO=y
CONFIG_ZMK_HID_IO_PLOVER_HID=y

# The Zen display is enabled by the upstream board defaults. The old fork's
# HIDE_MOMENTARY_LAYERS, FULL_REFRESH_PERIOD and HIDE_HEADING options no
# longer exist in upstream and must not be assigned here.
